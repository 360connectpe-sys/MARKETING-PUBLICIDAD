<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #8ecfff; }
    #wd-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    #wd-fontprobe { position: absolute; left: -9999px; top: 0; font-family: "Archivo Black", sans-serif; font-size: 20px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-duration="48">
    <canvas id="wd-canvas" width="1080" height="1920"></canvas>
    <div id="wd-fontprobe" data-layout-ignore>TU NEGOCIO</div>
  </div>
  <script>
    (function () {
      var clock = { t: 0 };
      var host = { clock: clock, render: null };
      window.__world3d = host;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise(function (resolve) { host.ready = resolve; });
      var tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 48, duration: 48, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } });
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
    const host = window.__world3d;
    try { await document.fonts.load('120px "Archivo Black"'); } catch (e) {}

    // ---------- helpers ----------
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const ss = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
    const lerp = (a, b, k) => a + (b - a) * k;
    const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
    const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true, ...o });
    const box = (w, h, d, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.castShadow = true; b.receiveShadow = true; return b; };

    function textTexture(text, bg, fg, w = 1024, h = 220, size = 120) {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d");
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.fillStyle = fg; g.font = `${size}px "Archivo Black", Arial, sans-serif`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(text, w / 2, h / 2 + 6, w - 60);
      const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
      return tx;
    }
    function badgeTexture(label, ring) {
      const c = document.createElement("canvas"); c.width = 256; c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = "#ffffff"; g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.fill();
      g.lineWidth = 14; g.strokeStyle = ring; g.stroke();
      g.fillStyle = ring; g.font = '150px "Archivo Black", Arial, sans-serif';
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(label, 128, 140);
      const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
    }

    // ---------- renderer / scene ----------
    const canvas = document.getElementById("wd-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    const skyDay = new THREE.Color(0x8ecfff), skyDusk = new THREE.Color(0xffa36b);
    scene.background = skyDay.clone();
    scene.fog = new THREE.Fog(skyDay.clone(), 40, 90);
    const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 200);

    const hemi = new THREE.HemisphereLight(0xdff1ff, 0xc9744e, 1.1);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(9, 15, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
    sun.shadow.bias = -0.0008; sun.shadow.radius = 4;
    scene.add(sun);
    const spot = new THREE.SpotLight(0xfff1c2, 0, 0, 0.38, 0.6, 1.2);
    spot.position.set(3, 11, 7); spot.target.position.set(3, 1.5, 0.5);
    scene.add(spot, spot.target);

    // ground, sidewalk, street
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), mat(0xc9744e));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    const walk = box(16, 0.16, 3, mat(0xe9d7c4)); walk.position.set(0, 0.08, 2.9); scene.add(walk);
    const street = box(60, 0.04, 6, mat(0x6d6a72)); street.position.set(0, 0.02, 7.4); scene.add(street);
    for (let i = -6; i <= 6; i++) { const l = box(1.4, 0.05, 0.18, mat(0xf4f1e8)); l.position.set(i * 3, 0.05, 7.4); scene.add(l); }

    // far low-poly hills
    for (let i = 0; i < 9; i++) {
      const h = new THREE.Mesh(new THREE.ConeGeometry(6 + hash(i) * 5, 6 + hash(i + 9) * 6, 5), mat(i % 2 ? 0x7cc47f : 0x69b26f));
      h.position.set(-40 + i * 10, 2.5, -28 - hash(i + 3) * 8); h.rotation.y = hash(i + 5) * 3; scene.add(h);
    }

    // ---------- shops ----------
    function shop(x, o) {
      const g = new THREE.Group(); g.position.x = x;
      const body = box(4, 3.2, 3, mat(o.wall)); body.position.y = 1.6; g.add(body);
      const trim = box(4.3, 0.3, 3.3, mat(o.trim)); trim.position.y = 4.25; g.add(trim);
      const parapet = box(4, 1.0, 0.35, mat(o.trim)); parapet.position.set(0, 3.7, 1.35); g.add(parapet);
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 0.8), new THREE.MeshStandardMaterial({ map: textTexture(o.sign, o.signBg, o.signFg), roughness: 0.5 }));
      sign.position.set(0, 3.7, 1.535); g.add(sign);
      // awning stripes
      for (let i = 0; i < 8; i++) {
        const s = box(0.5, 0.07, 1.25, mat(i % 2 ? o.awnA : o.awnB));
        s.position.set(-1.75 + i * 0.5, 2.82, 2.05); s.rotation.x = 0.38; g.add(s);
        const v = box(0.5, 0.28, 0.05, mat(i % 2 ? o.awnA : o.awnB));
        v.position.set(-1.75 + i * 0.5, 2.48, 2.64); g.add(v);
      }
      const glass = mat(0x9fd6ff, { roughness: 0.15, metalness: 0.3, emissive: 0x16324a, flatShading: false });
      const frame = mat(0x2a2d36);
      const df = box(1.12, 2.12, 0.08, frame); df.position.set(1.0, 1.06, 1.51); g.add(df);
      const door = box(0.95, 1.95, 0.1, glass); door.position.set(1.0, 1.0, 1.53); g.add(door);
      const wf = box(1.95, 1.45, 0.08, frame); wf.position.set(-0.75, 1.45, 1.51); g.add(wf);
      const win = box(1.8, 1.3, 0.1, glass); win.position.set(-0.75, 1.45, 1.53); g.add(win);
      for (const px of [-2.35, 2.35]) {
        const pot = box(0.5, 0.45, 0.5, mat(0xf2ede4)); pot.position.set(px, 0.38, 2.2); g.add(pot);
        const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), mat(0x58a964)); bush.position.set(px, 0.95, 2.2); bush.castShadow = true; g.add(bush);
      }
      scene.add(g); return g;
    }
    shop(-3, { wall: 0xe8893f, trim: 0x8a4b26, sign: "TU COMPETENCIA", signBg: "#5a2f17", signFg: "#ffd9a8", awnA: 0xffffff, awnB: 0xf07a22 });
    shop(3, { wall: 0x4a4f5a, trim: 0x2c2f36, sign: "TU NEGOCIO", signBg: "#16181d", signFg: "#ffffff", awnA: 0xffffff, awnB: 0x8d939e });

    // trees
    for (const [tx, tz, s] of [[-6.8, 2.6, 1.1], [0, 3.3, 0.9], [6.8, 2.6, 1.15], [-9.5, -1, 1.4], [9.5, -1, 1.3]]) {
      const tr = box(0.22, 1.2, 0.22, mat(0x7a4a2a)); tr.position.set(tx, 0.6 * s, tz); tr.scale.setScalar(s); scene.add(tr);
      const f1 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 0), mat(0x4fa35c)); f1.position.set(tx, 1.7 * s, tz); f1.scale.setScalar(s); f1.castShadow = true; scene.add(f1);
      const f2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), mat(0x67bd6f)); f2.position.set(tx + 0.15, 2.45 * s, tz); f2.scale.setScalar(s); f2.castShadow = true; scene.add(f2);
    }

    // clouds
    const clouds = [];
    for (let i = 0; i < 7; i++) {
      const c = new THREE.Group();
      for (let j = 0; j < 4; j++) { const p = new THREE.Mesh(new THREE.IcosahedronGeometry(1 + hash(i * 7 + j) * 0.9, 0), mat(0xffffff, { roughness: 1 })); p.position.set(j * 1.3 - 2, hash(i + j) * 0.6, hash(j * 3 + i) * 0.8); c.add(p); }
      c.userData.base = new THREE.Vector3(-26 + i * 9, 13 + hash(i) * 5, -18 - hash(i + 2) * 8);
      scene.add(c); clouds.push(c);
    }

    // ---------- pins ----------
    function pin(color) {
      const g = new THREE.Group();
      const m = mat(color, { roughness: 0.35, flatShading: false });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 20), m); head.position.y = 1.1; head.castShadow = true; g.add(head);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.05, 32), m); tip.rotation.x = Math.PI; tip.position.y = 0.45; tip.castShadow = true; g.add(tip);
      const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTexture("1", "#e53935"), depthTest: false }));
      badge.scale.set(0.95, 0.95, 1); badge.position.y = 1.12; badge.renderOrder = 5; g.add(badge);
      g.userData.badge = badge; scene.add(g); return g;
    }
    const compPin = pin(0xe53935);
    const myPin = pin(0x1e6fff);
    const tex = { r1: badgeTexture("1", "#e53935"), r2: badgeTexture("2", "#e53935"), b1: badgeTexture("1", "#1e6fff") };
    myPin.userData.badge.material.map = tex.b1;
    const client = pin(0x22c3ff); client.scale.setScalar(0.6); client.userData.badge.visible = false;
    client.position.set(-0.4, 0, 9.2);

    // distance rings (around the client)
    const rings = [];
    for (let i = 0; i < 4; i++) {
      const r = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 72), new THREE.MeshBasicMaterial({ color: 0x1e6fff, transparent: true, opacity: 0, side: THREE.DoubleSide }));
      r.rotation.x = -Math.PI / 2; r.position.set(-0.4, 0.06, 9.2); scene.add(r); rings.push(r);
    }

    // ---------- stars ----------
    const sh = new THREE.Shape();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 0.42 : 1; const px = Math.cos(a) * rr, py = -Math.sin(a) * rr; i ? sh.lineTo(px, py) : sh.moveTo(px, py); }
    const starGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 1 });
    starGeo.center();
    const starMat = new THREE.MeshStandardMaterial({ color: 0xffc83d, emissive: 0x7a4b00, emissiveIntensity: 0.5, roughness: 0.38, metalness: 0.35, flatShading: true });
    const mkStar = () => { const s = new THREE.Mesh(starGeo, starMat); s.castShadow = true; scene.add(s); return s; };
    const compStars = Array.from({ length: 5 }, mkStar);
    const myStars = Array.from({ length: 12 }, mkStar);

    // ---------- camera path ----------
    // [t, cut?, pos, look]
    const K = [
      [0, 0, [0, 4.6, 20.5], [0, 2.6, 0]],
      [5.4, 0, [-2.6, 3.4, 12.5], [-2.8, 2.7, 0]],
      [7.2, 1, [3.6, 3.1, 12.5], [3, 2.4, 0]],
      [10.0, 0, [3, 2.9, 10.5], [3, 2.4, 0]],
      [10.05, 1, [0, 6.5, 19], [0, 2.4, 0]],
      [12.0, 0, [0, 6, 17.5], [0, 2.4, 0]],
      [12.05, 1, [3, 2.5, 8.2], [3, 2.6, 0]],
      [14.5, 0, [3.3, 2.5, 7.2], [3, 2.6, 0]],
      [14.55, 1, [-0.4, 19, 15.5], [-0.4, 0, 4.5]],
      [16.8, 0, [-0.4, 21, 14], [-0.4, 0, 4.5]],
      [16.85, 1, [-3, 4.3, 9.5], [-3, 4.4, 0]],
      [20.4, 0, [-3.3, 4.6, 8.2], [-3, 4.6, 0]],
      [20.45, 1, [0, 25, 9], [0, 0, 1.5]],
      [22.6, 0, [0, 23, 10], [0, 0, 1.5]],
      [24.0, 0, [3.6, 5.2, 12.5], [3, 2.8, 0]],
      [28.6, 0, [3.1, 4.8, 11], [3, 3.2, 0]],
      [31.0, 0, [0, 7.5, 18], [0, 3.2, 0]],
      [32.4, 0, [0, 7.3, 17.5], [0, 3.2, 0]],
      [32.45, 1, [4.4, 3.0, 11.5], [3, 4.7, 0]],
      [41.4, 0, [4.7, 3.3, 9.6], [3, 4.9, 0]],
      [48, 0, [4.7, 3.3, 9.6], [3, 4.9, 0]],
    ];
    const P = new THREE.Vector3(), L = new THREE.Vector3();
    function cam(t) {
      let i = 0; while (i < K.length - 2 && t >= K[i + 1][0]) i++;
      const a = K[i], b = K[i + 1];
      if (b[1]) { P.set(...a[2]); L.set(...a[3]); }
      const k = b[1] ? 0 : ss(a[0], b[0], t);
      P.set(lerp(a[2][0], b[2][0], k), lerp(a[2][1], b[2][1], k), lerp(a[2][2], b[2][2], k));
      L.set(lerp(a[3][0], b[3][0], k), lerp(a[3][1], b[3][1], k), lerp(a[3][2], b[3][2], k));
      if (b[1] && t >= b[0]) { P.set(...b[2]); L.set(...b[3]); }
      camera.position.copy(P); camera.lookAt(L);
    }

    // ---------- render(t) ----------
    const tmp = new THREE.Color();
    host.render = (t) => {
      cam(t);
      // golden hour from 32.45
      const dusk = ss(32.3, 33.2, t);
      scene.background.copy(skyDay).lerp(skyDusk, dusk);
      scene.fog.color.copy(scene.background);
      sun.color.copy(tmp.set(0xffffff).lerp(new THREE.Color(0xffb36b), dusk));
      sun.intensity = lerp(2.4, 2.9, dusk);
      sun.position.set(lerp(9, 14, dusk), lerp(15, 6, dusk), 11);
      hemi.intensity = lerp(1.1, 0.75, dusk);
      // spotlight on your shop (7.2–10)
      spot.intensity = 260 * ss(7.25, 7.7, t) * (1 - ss(9.7, 10.0, t));

      clouds.forEach((c, i) => { const b = c.userData.base; c.position.set(b.x + t * (0.25 + hash(i) * 0.2), b.y, b.z); });

      // competitor pin: drops at 0.6, number 1 → 2 at 30
      const cp = ss(0.6, 1.2, t);
      compPin.visible = t >= 0.6;
      compPin.position.set(-3, 4.75 + (1 - easeOutBack(cp)) * 6 + Math.sin(t * 2.2) * 0.12, 0.4);
      compPin.rotation.y = Math.sin(t * 1.3) * 0.25;
      compPin.userData.badge.material.map = t < 30.0 ? tex.r1 : tex.r2;
      const cs = t >= 30.0 ? 1 - 0.18 * ss(30.0, 30.4, t) : 1;
      compPin.scale.setScalar(cs);

      // your pin: drops at 29.6 with "1"
      myPin.visible = t >= 29.6;
      const mp = ss(29.6, 30.3, t);
      myPin.position.set(3, 4.75 + (1 - easeOutBack(mp)) * 7 + Math.sin(t * 2.2 + 1) * 0.12, 0.4);
      myPin.scale.setScalar(1 + 0.15 * Math.max(0, Math.sin(clamp((t - 30.3) * 4, 0, Math.PI))));

      // client pin + distance rings: 14.55–16.8 and 20.45–22.6
      const showD = (t >= 14.55 && t < 16.85) || (t >= 20.45 && t < 22.7);
      client.visible = showD;
      client.position.y = 0.05 + Math.abs(Math.sin(t * 3)) * 0.15;
      rings.forEach((r, i) => {
        const ph = ((t * 0.55 + i * 0.25) % 1);
        const rad = 1 + ph * 9;
        r.scale.setScalar(rad);
        r.material.opacity = showD ? (1 - ph) * 0.85 : 0;
      });

      // competitor stars orbit above its roof (16.85–20.45 and the top view)
      const showC = t >= 16.85 && t < 22.7;
      compStars.forEach((s, i) => {
        const a = t * 0.9 + (i / 5) * Math.PI * 2;
        const pop = ss(16.9 + i * 0.12, 17.25 + i * 0.12, t);
        s.visible = showC;
        s.position.set(-3 + Math.cos(a) * 1.7, 5.6 + Math.sin(t * 2 + i) * 0.12, 0.2 + Math.sin(a) * 1.7);
        s.rotation.set(0, a * 2, 0);
        s.scale.setScalar(0.38 * easeOutBack(pop));
      });

      // your stars fall in one by one 24.4–30, then orbit
      myStars.forEach((s, i) => {
        const t0 = 24.4 + i * 0.42;
        s.visible = t >= t0;
        const land = ss(t0, t0 + 0.55, t);
        const a = t * 0.8 + (i / 12) * Math.PI * 2;
        const ox = 3 + Math.cos(a) * 1.9, oz = 0.2 + Math.sin(a) * 1.9, oy = 5.7 + Math.sin(t * 2 + i) * 0.1;
        s.position.set(lerp(3 + (hash(i) - 0.5) * 6, ox, land), lerp(16, oy, land), lerp(4, oz, land));
        s.rotation.set(0, a * 2 + (1 - land) * 6, (1 - land) * 3);
        s.scale.setScalar(0.34);
      });

      renderer.render(scene, camera);
    };
    host.render(host.clock.t);
    host.ready();
  </script>
</template>
